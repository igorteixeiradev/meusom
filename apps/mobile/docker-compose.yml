services:
  android:
    image: budtmo/docker-android:emulator_14.0
    container_name: android-emulator-meusom
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
    ports:
      - '6080:6080' # noVNC (acesso pelo browser)
      - '5900:5900'
      - '5554:5554'
      - '5555:5555'
      - '9000:9000'
    environment:
      EMULATOR_DEVICE: 'Samsung Galaxy S10'
      EMULATOR_NO_SKIN: 'false'
      EMULATOR_DATA_PARTITION: '550m'
      WEB_VNC: 'true'
      # VNC_PASSWORD: "minha_senha"
      WEB_LOG: 'true'

    volumes:
      - .docker/android:/home/androidusr

    healthcheck:
      test: ['CMD', 'cat', 'device_status']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

    restart: unless-stopped

volumes:
  android-data:
    driver: local
